<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Synthetic Rule Intelligence Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Synthetic Rule Intelligence Lab web edition — neo-brutalist financial intelligence. Same tokens as the Streamlit prototype. */
:root{--ink:#111827;--paper:#F5F0E6;--white:#fff;--yellow:#F4D52E;--coral:#EF5147;--blue:#2479D8;--grey:#747474;--line:#2c3546;
  --display:'Barlow Condensed',Bahnschrift,'Arial Narrow',sans-serif;--body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--blue)}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{background:var(--ink);color:var(--paper);border-right:4px solid var(--yellow);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.brand span{background:var(--yellow);color:var(--ink);border:2px solid var(--paper);padding:0 6px;margin-left:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
aside .mono{color:#b9b3a5}
.navhead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--yellow);text-transform:uppercase;border-top:2px solid var(--line);padding-top:12px;margin:16px 0 8px}
nav{display:flex;flex-direction:column;gap:6px;counter-reset:n}
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--yellow);margin:14px 0 2px}
.lablog{background:var(--ink);color:var(--yellow);font-family:var(--mono);font-size:13px;line-height:1.7;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--yellow);padding:12px 16px;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)} .lablog b{color:var(--paper)}
.flow4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin:12px 0 16px}
.flow4 div{padding:12px 14px;background:#fff;border-right:2.5px solid var(--ink)} .flow4 div:last-child{border-right:0} .flow4 div.on{background:var(--yellow)}
.flow4 b{font-family:var(--display);font-size:21px;display:block} .flow4 span{font-family:var(--mono);font-size:11px;text-transform:uppercase}
@media (max-width:900px){.flow4{grid-template-columns:1fr 1fr}}
.atlas{background:#fff;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);overflow-x:auto} .atlas g.node{cursor:pointer}
nav a{counter-increment:n;display:flex;align-items:center;gap:12px;padding:9px 12px;border:2px solid var(--line);background:#18202f;color:var(--paper);text-decoration:none;font-family:var(--display);font-size:18px;font-weight:600}
nav a::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:#8c96a8;min-width:22px}
nav a:hover{border-color:var(--yellow);transform:translateX(2px)}
nav a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
nav a.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--paper)}
nav a.on::before{color:var(--ink)}
.sidefoot{border:2px solid var(--line);padding:10px 12px;margin-top:18px;font-family:var(--mono);font-size:11px;color:#b9b3a5;line-height:1.7}
.sidefoot b{color:var(--paper)} .ok{background:var(--blue);color:#fff;padding:0 5px;font-weight:600}
main{padding:28px max(18px,env(safe-area-inset-right)) 60px max(18px,env(safe-area-inset-left));max-width:1360px;width:100%}
.sect{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--yellow);display:inline-block;padding:3px 9px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,46px);line-height:1.05;margin:8px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:28px 0 10px}
h3{font-family:var(--display);font-weight:700;font-size:20px;margin:6px 0}
.lede{max-width:78ch;color:#2c2c2c}
.card{background:var(--white);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px 16px;min-width:0}
.card.y{background:var(--yellow)} .card.ink{background:var(--ink);color:var(--paper)}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))} .g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi b{display:block;font-family:var(--display);font-size:clamp(24px,2.4vw,34px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;padding:1px 7px;border:2px solid var(--ink);margin-right:6px}
.PASS,.High{background:var(--blue);color:#fff} .FAIL{background:var(--coral);color:#fff} .Medium{background:var(--yellow)} .Low{background:#fff}
.formula{font-family:var(--mono);font-size:13px;background:var(--paper);border:2px dashed var(--ink);padding:8px 10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
figure{margin:0} figure img{width:100%;height:auto;display:block;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#fff}
figcaption{font-family:var(--mono);font-size:11px;color:#444;margin-top:8px}
.tbl{overflow-x:auto;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:7px 9px;position:sticky;top:0}
td{padding:6px 9px;border-bottom:1px solid #e3ddcf;vertical-align:top} tr.pick{cursor:pointer} tr.pick:hover{background:#fff7cf} tr.sel{background:var(--yellow)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:10px 0 14px}
.controls label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
select,input[type=date]{font-family:var(--body);font-size:14px;padding:6px 8px;border:2px solid var(--ink);background:#fff;border-radius:0;min-width:150px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
button{font-family:var(--display);font-weight:700;font-size:16px;border:2.5px solid var(--ink);background:var(--yellow);box-shadow:3px 3px 0 var(--ink);padding:5px 14px;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chip{font-family:var(--mono);font-size:11px;border:2px solid var(--ink);background:#fff;padding:3px 8px;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:var(--yellow)}
svg text{font-family:var(--mono);font-size:10px;fill:var(--ink)}
.empty{background:var(--yellow);border:2.5px solid var(--ink);padding:14px 16px;font-weight:600}
.page{display:none} .page.on{display:block}
.menu-btn{display:none}
@media (max-width:900px){.shell{grid-template-columns:1fr} aside{position:relative;height:auto;border-right:0;border-bottom:4px solid var(--yellow)}
  nav{flex-direction:row;flex-wrap:wrap} nav a{font-size:15px;padding:6px 9px}}
@media (prefers-reduced-motion:reduce){nav a:hover{transform:none}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">SYNTHETIC<br>RULE <span>LAB</span></div>
  <div class="mono" style="margin-top:8px">Synthetic Rule Intelligence Lab<br>UMDAC Datathon 2026 · Swift case</div>
  <div class="navhead">Navigate</div>
  <nav id="nav"></nav>
  <div class="sidefoot" id="sidefoot"></div>
</aside>
<main id="main"></main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.register, RI = Object.fromEntries(R.map(r => [r.id, r]));
const fmt = (x, d = 0) => Number(x).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (x, d = 1) => (100 * x).toFixed(d) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAGES = [['overview','Lab Overview'],['observatory','Dataset Observatory'],['transactions','Transaction Workbench'],['discovery','Discovery Engine'],['forensics','Forensics Lab'],
  ['rules','Rule Explorer'],['atlas','Dependency Atlas'],['routes','Route Observatory'],['validation','Validation Centre'],['anomalies','Anomaly Intelligence'],['method','Methodology & Lineage']];
const GROUPS = {overview: '▸ 01 DISCOVER', rules: '▸ 02 RECONSTRUCT', validation: '▸ 03 VALIDATE', method: '▸ 04 EXPLAIN'};
const nPass = R.filter(r => r.status === 'PASS').length;
document.getElementById('nav').innerHTML = PAGES.map(([k, t]) => (GROUPS[k] ? `<div class="grp">${GROUPS[k]}</div>` : '') + `<a href="#${k}" data-k="${k}">${t}</a>`).join('');
document.getElementById('sidefoot').innerHTML = `<span class="ok">${nPass}/${R.length} PASS</span> validators · 5 splits<br><b>10,000,000</b> payments · 0 dropped<br>validated ${esc(D.generated.replace('T',' '))}<br>independent prototype · not affiliated with Swift`;
const card = (h, c = '') => `<div class="card ${c}">${h}</div>`;
const kpis = items => `<div class="grid g5">${items.map(([v, l]) => card(`<div class="kpi"><b>${v}</b><span>${l}</span></div>`)).join('')}</div>`;
const fig = (f, cap) => `<figure><img src="charts/${f}.png" alt="${esc(cap)}" loading="lazy"><figcaption>${esc(cap)}</figcaption></figure>`;
const ruleCard = id => { const r = RI[id]; return card(`<span class="tag ${r.status}">${r.status}</span><span class="tag ${r.confidence}">${r.confidence.toUpperCase()}</span><span class="mono">${id} · TYPE ${r.type} · ${esc(r.layer)}</span><h3>${esc(r.title)}</h3><div><b>Reading:</b> ${esc(r.economic)}</div><div class="mono" style="margin-top:6px;text-transform:none">Acceptance · ${esc(r.criterion)}</div>`); };
const table = (rows, cols, opts = {}) => `<div class="tbl" style="${opts.h ? 'max-height:' + opts.h + 'px' : ''}"><table><thead><tr>${cols.map(c => `<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr ${opts.pick ? `class="pick ${opts.sel === r[opts.pick] ? 'sel' : ''}" data-id="${esc(r[opts.pick])}" tabindex="0"` : ''}>${cols.map(c => `<td>${c[2] ? c[2](r[c[0]], r) : esc(r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function bars(data, xk, yk, opt = {}) {   // minimal accessible SVG bar chart (one scale, labelled axis)
  const W = opt.w || 900, H = opt.h || 240, P = {l: 56, r: 10, t: 10, b: 28}, n = data.length;
  if (!n) return '<div class="empty">No data in the current selection.</div>';
  const max = Math.max(...data.map(d => d[yk])) || 1, bw = (W - P.l - P.r) / n;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label || '')}" style="background:#fff;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink)">
   ${ticks.map(t => { const y = H - P.b - (t / max) * (H - P.t - P.b); return `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#e9e3d6"/><text x="${P.l - 6}" y="${y + 3}" text-anchor="end">${t >= 1e3 ? fmt(t / 1e3) + 'k' : fmt(t, t < 10 ? 2 : 0)}</text>`; }).join('')}
   ${data.map((d, i) => { const h = (d[yk] / max) * (H - P.t - P.b); return `<rect x="${P.l + i * bw + 1}" y="${H - P.b - h}" width="${Math.max(bw - 2, 1)}" height="${h}" fill="${opt.color ? opt.color(d) : '#2479D8'}" stroke="#111827" stroke-width="${bw > 6 ? 1 : 0}"><title>${esc(d[xk])}: ${fmt(d[yk], opt.dec || 0)}</title></rect>`; }).join('')}
   <line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="#111827" stroke-width="1.5"/>
   ${data.map((d, i) => (i % Math.ceil(n / (opt.xt || 10)) === 0) ? `<text x="${P.l + i * bw + bw / 2}" y="${H - 10}" text-anchor="middle">${esc(opt.xf ? opt.xf(d[xk]) : d[xk])}</text>` : '').join('')}</svg>`;
}

const P = {};
P.overview = () => {
  const c2 = RI.C2.metrics.full, cnt = k => R.filter(r => r.confidence === k).length, pr = D.discovery.pairs, strong = pr.filter(p => p.v_dev >= .05);
  const ne = strong.filter(p => p.explained_by).length, nm = strong.filter(p => String(p.verdict || '').startsWith('mediated')).length;
  return `<div class="mono">The Synthetic Rule Intelligence Lab · independent competition prototype</div><h1>Decode the rules behind 10 million synthetic payments</h1>
  <div class="flow4"><div class="on"><span>01 · Discover</span><b>${pr.length} pairs scanned</b><span>${strong.length} strong · ${D.discovery.trees.length} tree searches</span></div>
   <div><span>02 · Reconstruct</span><b>${R.length} explicit rules</b><span>formula + logic each</span></div><div><span>03 · Validate</span><b>${nPass}/${R.length} pass 5 splits</b><span>halves · periods · out-of-sample</span></div>
   <div><span>04 · Explain</span><b>${D.atlas.edges.length} atlas edges</b><span>economics · limits · lineage</span></div></div>
  ${kpis([['10,000,000', 'payments · 0 dropped'], [`${ne}+${nm}/${strong.length}`, 'strong dependencies explained'], [`${cnt('High')}·${cnt('Medium')}·${cnt('Low')}`, 'high · medium · low confidence'], [pct((c2.n - c2.exceptions) / c2.n, 5), 'FX rule exact match'], ['100%', 'SQL vs independent Python']])}<br>
  <div class="lablog"><b>LAB LOG</b> — what changed our mind<br>&gt; discovery engine flagged <b>routing type × sender country</b> → <b>R2 revised</b>: Covered is a per-bank propensity, not a constant 11.3%<br>
  &gt; flagged <b>routing × home currency</b> → <b>C3 discovered</b>: currency drawn from the route (${pct(RI.C3.metrics.full.in_route_share)} in a route currency)<br>
  &gt; flagged <b>receiver type × receiver bank country</b> → <b>P5 discovered</b>: customer mix is a bank attribute<br>
  &gt; change-point search → <b>T4b</b>: ${RI.T4b.metrics.full.change_points} change points, all on Mondays · cents forensics → <b>F1</b>: USD ${pct(RI.F1.metrics.full.usd_whole_share, 0)} whole-dollar vs ${pct(RI.F1.metrics.full.non_usd_whole_share)}<br>
  &gt; open: bank-pair affinity mechanism (G1) · weekly level values (T4) · CUSTOMER_RECALL has no signature (X5)</div>
  <h2>Headline rules</h2><div class="grid g3">${['C2','C3','R1','G3','D2','A1'].map(id => card(`<span class="tag ${RI[id].confidence}">${id}</span><span class="mono">${esc(RI[id].group)}</span><h3>${esc(RI[id].title)}</h3><div class="formula">${esc(RI[id].formulation)}</div><a href="#rules/${id}" class="mono" style="text-transform:none">Open in Rule Explorer →</a>`)).join('')}</div>`;
};
P.observatory = () => `<span class="sect">DISCOVER · data foundation</span><h1>Dataset observatory</h1><p class="lede">What the raw file is, how it was parsed, and what had to be decided before any rule was tested.</p>
  ${kpis([['4.61 GiB', 'raw CSV, read-only'], ['21 → 20', 'columns (DISCLAIMER: 1 row)'], ['93 days', '30 Apr – 31 Jul 2023 UTC'], ['0', 'missing / invalid numerics'], [pct(D.crossCheck.C2_python_match, 0), 'SQL vs Python agreement']])}
  <h2>Timestamp coverage</h2>${bars(D.daily, 'd', 'n', {label: 'payments per UTC day', color: d => [0, 6].includes(d.dow) ? '#F4D52E' : '#2479D8', xt: 8, xf: v => v.slice(5)})}
  <figcaption>Payments per UTC day; weekends in yellow. Volume moves in week-long steps (rule T4).</figcaption>
  <h2>Issues log</h2>${table(D.issues, [['issue', 'Issue'], ['scale', 'Scale'], ['decision', 'Decision']])}`;

const TX = {an: null, tt: null, ot: null, bt: null};
P.transactions = () => {
  const m = D.cube, all = k => [...new Set(m.map(r => r[k]))].sort();
  for (const k of ['an', 'tt', 'ot', 'bt']) if (!TX[k]) TX[k] = new Set(all({an: 'anom', tt: 'ttype', ot: 'otype', bt: 'btype'}[k]));
  if (!TX.d0) { TX.d0 = D.dmin; TX.d1 = D.dmax; }
  const chip = (k, v) => `<span class="chip ${TX[k].has(v) ? 'on' : ''}" role="checkbox" aria-checked="${TX[k].has(v)}" tabindex="0" data-k="${k}" data-v="${esc(v)}">${esc(v)}</span>`;
  const f = m.filter(r => TX.an.has(r.anom) && TX.tt.has(r.ttype) && TX.ot.has(r.otype) && TX.bt.has(r.btype) && r.d >= TX.d0 && r.d <= TX.d1);
  const N = f.reduce((a, r) => a + r.n, 0), S = k => f.reduce((a, r) => a + r[k], 0);
  const ctl = `<div class="card"><div class="controls"><label>From<input type="date" id="d0" value="${TX.d0}" min="${D.dmin}" max="${D.dmax}"></label><label>To<input type="date" id="d1" value="${TX.d1}" min="${D.dmin}" max="${D.dmax}"></label><button id="txreset">Reset filters</button></div>
   <div class="mono">Routing type</div><div class="chips">${all('ttype').map(v => chip('tt', v)).join('')}</div><br><div class="mono">Anomaly label</div><div class="chips">${all('anom').map(v => chip('an', v)).join('')}</div><br>
   <div class="mono">Sender · receiver type</div><div class="chips">${['B', 'C'].map(v => chip('ot', v)).join('')}<span style="width:14px"></span>${['B', 'C'].map(v => chip('bt', v)).join('')}</div></div>`;
  let body;
  if (!N) body = '<br><div class="empty">No payments match these filters. Add a category or widen the dates, or press Reset filters.</div>';
  else {
    const byd = Object.values(f.reduce((a, r) => { (a[r.d] = a[r.d] || {d: r.d, n: 0, dow: new Date(r.d + 'T00:00:00Z').getUTCDay()}).n += r.n; return a; }, {})).sort((a, b) => a.d < b.d ? -1 : 1);
    const seg = ['CC', 'BC', 'CB', 'BB'].map(s => { const g = f.filter(r => r.otype + r.btype === s), n = g.reduce((a, r) => a + r.n, 0); return {seg: s[0] + '→' + s[1], n, obs: n ? g.reduce((a, r) => a + r.s_lnamt, 0) / n : null, rule: 6 + 2 * (s[0] === 'B') + 2 * (s[1] === 'B')}; }).filter(x => x.n);
    body = `<br>${kpis([[fmt(N), 'payments in filter'], ['$' + fmt(Math.exp(S('s_lnamt') / N)), 'geometric-mean amount'], [pct(S('n_slow') / N), 'with a manual step'], [(S('s_fx') / N).toFixed(2), 'mean FX conversions'], [pct(S('n_gap') / N), 'paths with hidden hops']])}
     <h2>Daily volume in filter</h2>${bars(byd, 'd', 'n', {label: 'daily volume', color: d => [0, 6].includes(d.dow) ? '#F4D52E' : '#2479D8', xt: 8, xf: v => v.slice(5)})}
     <h2>Rule A1 check: mean ln(amount) by party type</h2>${table(seg, [['seg', 'Sender→receiver'], ['n', 'Payments', v => fmt(v)], ['obs', 'Observed mean ln(USD)', v => v.toFixed(3)], ['rule', 'Rule A1 prediction', v => v.toFixed(0)]])}`;
  }
  return `<span class="sect">DISCOVER · filter-aware</span><h1>Transaction workbench</h1><p class="lede">Filters re-aggregate the additive cube (17,648 cells that sum to exactly 10,000,000 payments) in your browser.</p>${ctl}${body}`;
};
P.routes = () => {
  const g = D.graph, nw = g.network, cn = g.concentration;
  return `<span class="sect">RECONSTRUCT · graph</span><h1>Payment route observatory</h1><p class="lede">Banks are nodes; observed hops are edges ('...' removed, parallel edges and loops kept).</p>
  ${kpis([[fmt(nw.nodes), 'banks (nodes)'], [fmt(nw.edges), 'directed edges'], [fmt(nw.hops), 'observed hops'], [cn.gini_strength.toFixed(2), 'Gini of bank volume'], [pct(cn.top1pct_share, 0), 'volume through top 1% banks']])}<br>
  <div class="grid g2">${ruleCard('G3')}${ruleCard('G1')}</div><br><div class="grid g2">${fig('graph_loops', 'Observed path-loop rate vs prediction from size-weighted draws with replacement')}${fig('graph_pairs', 'Bank-pair counts vs independence expectation')}</div><br>
  <div class="grid g2">${fig('graph_hubs', 'Share of manual (non-STP) banks by PageRank decile')}${fig('hops', 'Hop counts vs geometric(1 − 1/e)')}</div>
  <h2>Route explorer</h2><div class="card"><div class="controls"><label>Routing type<select id="rxt"><option>All</option>${[...new Set(g.routes.map(r => r.ttype))].sort().map(t => `<option>${t}</option>`).join('')}</select></label>
   <label>Passes through<select id="rxc"><option>Any</option>${[...new Set(g.routes.flatMap(r => r.route.split(' › ')))].sort().map(c => `<option>${c}</option>`).join('')}</select></label>
   <label>Countries on route<select id="rxl"><option>Any</option>${[2,3,4,5,6].map(n => `<option>${n}</option>`).join('')}</select></label></div><div id="rxout"></div></div>`;

  if (key === 'validation') document.querySelectorAll('tr.pick').forEach(tr => tr.onclick = () => { location.hash = 'rules/' + tr.dataset.id; });
  if (key === 'transactions') {
    document.querySelectorAll('.chip').forEach(c => { const t = () => { const s = TX[c.dataset.k]; s.has(c.dataset.v) ? s.delete(c.dataset.v) : s.add(c.dataset.v); render(); }; c.onclick = t; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } }; });
    document.getElementById('d0').onchange = e => { TX.d0 = e.target.value || D.dmin; render(); };
    document.getElementById('d1').onchange = e => { TX.d1 = e.target.value || D.dmax; render(); };
    document.getElementById('txreset').onclick = () => { TX.an = TX.tt = TX.ot = TX.bt = null; TX.d0 = D.dmin; TX.d1 = D.dmax; render(); };
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render); render();
</script>
</body>
</html>
